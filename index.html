function vehiclePanel(){if(state.hp<=0)return;let v=driving||closestCar();if(!v){tell('Move beside an abandoned vehicle');return}let c=v.c,p=$('panel');p.style.display='block';let total=Object.values(c.cargo).reduce((a,b)=>a+b,0);p.innerHTML='<h2>'+v.name+'</h2><p>Condition '+Math.ceil(c.hp)+'% | Fuel '+c.fuel.toFixed(1)+'/20 | Cargo '+total+'/'+v.capacity+'</p><p>Gasoline in bag '+state.fuel+' | Metal '+state.metal+' | Scrap '+state.scrap+'</p><button id="claimCar">'+(c.claimed?'CLAIMED':'CLAIM VEHICLE')+'</button><button id="fuelCar">REFUEL +1</button><button id="repairCar">REPAIR +25</button><button id="driveCar">'+(driving?'EXIT VEHICLE':'DRIVE')+'</button><p>Repairs cost 2 scrap and 1 metal. Use the movement joystick to steer and drive.</p><h3>Vehicle cargo</h3>'+vehicleGoods.map(k=>'<p>'+k+' · Bag '+state[k]+' / Cargo '+(c.cargo[k]||0)+' <button data-cargo="'+k+'" data-op="in">STORE</button><button data-cargo="'+k+'" data-op="out">TAKE</button></p>').join('')+'<button id="carBack">RETURN</button><p id="carNote"></p>';let note=t=>$('carNote').textContent=t;$('claimCar').onclick=()=>{c.claimed=true;save();vehiclePanel()};$('fuelCar').onclick=()=>{if(!c.claimed)return note('Claim first');if(state.fuel<1||c.fuel>19)return note('No gasoline or tank full');state.fuel--;c.fuel++;save();vehiclePanel()};$('repairCar').onclick=()=>{if(!c.claimed||state.scrap<2||state.metal<1||c.hp>=100)return note('Claim vehicle and gather repair materials');state.scrap-=2;state.metal--;c.hp=Math.min(100,c.hp+25);save();vehiclePanel()};$('driveCar').onclick=()=>{if(driving){if(!exitCar())return note('No safe exit')}else{if(!c.claimed||c.hp<=0||c.fuel<=0)return note('Claim, repair and refuel first');driving=v;player.position.copy(v.g.position);player.visible=false;$('vehicle').textContent='EXIT / CAR';save()}p.style.display='none'};p.querySelectorAll('[data-cargo]').forEach(b=>b.onclick=()=>{if(!c.claimed)return note('Claim first');let k=b.dataset.cargo;if(b.dataset.op==='in'){if(state[k function driveTick(v,dt){let car=driving,c=car.c;crashCool=Math.max(0,crashCool-dt);if(!v.length()||c.hp<=0||c.fuel<=0)return;let strength=Math.min(1,v.length());v.normalize();let target=Math.atan2(v.x,v.z),delta=Math.atan2(Math.sin(target-c.angle),Math.cos(target-c.angle));c.angle+=Math.max(-dt*3,Math.min(dt*3,delta));car.g.rotation.y=c.angle;let step=Math.min(car.speed*dt*strength,c.fuel*100),x=c.x+Math.sin(c.angle)*step,z=c.z+Math.cos(c.angle)*step;let hit=Math.abs(x)>149||Math.abs(z)>149||walls.some(w=>Math.abs(x-w.x)<w.w/2+2.1&&Math.abs(z-w.z)<w.d/2+2.1)||cars.some(q=>q!==car&&Math.hypot(q.c.x-x,q.c.z-z)<4);if(hit){if(!crashCool){c.hp=Math.max(0,c.hp-4);crashCool=1;tell('Vehicle collision')}}else{c.x=x;c.z=z;c.fuel=Math.max(0,c.fuel-step/100);car.g.position.set(x,0,z);player.position.copy(car.g.position);facing.set(Math.sin(c.angle),0,Math.cos(c.angle));if(c.fuel<=0)tell('Out of gasoline')}}
