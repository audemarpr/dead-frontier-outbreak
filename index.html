,'Garage',12,-12,0x777d76,{metal:5,fuel:4});house('home','Safe house',-12,13,0x9b8975,{wood:4,clothes:1});house('police','Police station',12,13,0x7a8380,{ammo:18,metal:2});house('yard','Supply depot',-28,-12,0x756a58,{wood:10,metal:5});house('camp','Raider camp',28,-12,0x64584c,{food:4,ammo:10});

let audio;function sound(freq=90,duration=.12,type='triangle'){if(!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(20,freq/3),audio.currentTime+duration);g.gain.setValueAtTime(.10,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch{}}let active=false,keys={},notice='',until=0;function tell(s){sound(330,.08);notice=s;until=performance.now()+3000}function dist(x,z){return Math.hypot(player.position.x-x,player.position.z-z)}function nearest(a){return a.slice().sort((a,b)=>dist(a.x,a.z)-dist(b.x,b.z))[0]}function use(){let n=nearest(npcs.filter(n=>n.mesh.visible));if(n&&dist(n.x,n.z)<3){state.crew++;state.recruited.push(n.id);n.mesh.visible=false;tell(n.name+' joined your crew');save();return}let s=nearest(spots);if(dist(s.x,s.z)>3){tell('Move near a supply crate or survivor');return}if(s.id==='camp'&&enemies.some(e=>e.hostile&&e.m.visible)){tell('Clear the raiders first');return}if(!state.looted.includes(s.id)){for(let k in s.loot)state[k]+=s.loot[k];state.looted.push(s.id);tell('Collected supplies: '+s.name)}else tell('Already searched');if(s.id==='home'){state.home=true;tell('Safe house claimed')}if(s.id==='camp'){state.enemy=true;tell('Raider camp captured')}save()}

$('menu').onclick=()=>{let p=$('panel');p.style.display='block';p.innerHTML='<h2>Survivor journal</h2><p>Food '+state.food+' • Water '+state.water+' • Wood '+state.wood+' • Metal '+state.metal+' • Ammo '+state.ammo+' • Fuel '+state.fuel+' • Clothing '+state.clothes+'</p><p>Crew: '+state.crew+' / 2 | Home: '+(state.home?'Claimed':'Unclaimed')+' | Repairs: '+state.repair+'/3 | Raider camp: '+(state.enemy?'Captured':'Hostile')+'</p><p>Mission 1: Search the market. Mission 2: Claim the safe house. Mission 3: Recruit two survivors. Mission 4: Repair home. Mission 5: Capture raider camp.</p><button id="close">RETURN</button> <button id="reset">RESET SAVE</button>';$('close').onclick=()=>p.style.display='none';$('reset').onclick=()=>{if(confirm('Erase progress?')){localStorage.removeItem('outbreak-v01');location.reload()}}};document.querySelectorAll('[data-dir]').forEach(b=>{let k=b.dataset.dir;b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[k]=true};b.onpointerup=b.onpointercancel=()=>keys[k]=false});addEventListener('keydown',e=>keys[({w:'up',a:'left',s:'down',d:'right',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'})[e.key]]=true);addEventListener('keyup',e=>keys[({w:'up',a:'left',s:'down',d:'right',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'})[e.key]]=false);$('loading').textContent='Ready • Rotate phone to landscape';$('play').onclick=()=>{try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}active=true;$('start').style.display='none'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let joy={x:0,y:0},yaw=0,pitch=0,drag=null;const pad=$('pad');function moveStick(e){let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.max(40,Math.hypot(x,y));joy.x=x/d;joy.y=y/d;$('stick').style.transform=`translate(${joy.x*35}px,${joy.y*35}px)`}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);moveStick(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))moveStick(e)};pad.onpointerup=pad.onpointercancel=()=>{joy.x=joy.y=0;$('stick').style.transform='none'};let cv=renderer.domElement;cv.onpointerdown=e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(drag&&drag.id===e.pointerId){yaw-=(e.clientX-drag.x)*.008;pitch=Math.max(-2,Math.min(4,pitch+(e.clientY-drag.y)*.025));drag.x=e.clientX;drag.y=e.clientY}};cv.onpointerup=cv.onpointercancel=()=>drag=null;let last=performance.now(),tick=0;function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(active&&$('panel').style.display!=='block'&&state.hp>0){let v=new T.Vector3((keys.right?1:0)-(keys.left?1:0)+joy.x,0,(keys.down?1:0)-(keys.up?1:0)+joy.y);v.applyAxisAngle(new T.Vector3(0,1,0),yaw);if(v.length()){v.normalize();facing.copy(v);player.rotation.y=Math.atan2(v.x,v.z);for(let axis of ['x','z']){let p=player.position.clone();p[axis]+=v[axis]*5*dt;if(Math.abs(p[axis])<112&&!walls.some(w=>Math.abs(p.x-w.x)<w.w/2+.35&&Math.abs(p.z-w.z)<w.d/2+.35))player.position[axis]=p[axis]}}for(let e of enemies){if(!e.m.visible)continue;let d=dist(e.m.position.x,e.m.position.z);if(d<14&&d>1.2){let v=player.position.clone().sub(e.m.position).normalize();let p=e.m.position.clone().addScaledVector(v,dt*(e.hostile?2.4:1.4));if(!walls.some(w=>Math.abs(p.x-w.x)<w.w/2+.3&&Math.abs(p.z-w.z)<w.d/2+.3))e.m.position.copy(p);e.m.rotation.y=Math.atan2(v.x,v.z)}if(d<1.5)state.hp=Math.max(0,state.hp-dt*5)}state.hunger=Math.max(0,state.hunger-dt*.12);if(!state.hunger)state.hp=Math.max(0,state.hp-dt*2);tick+=dt;if(tick>3){save();tick=0}}for(let a of actors){let moving=Math.hypot(a.g.position.x-a.x,a.g.position.z-a.z)>.002;let swing=moving?Math.sin(now*.012)*.65:0;for(let j=0;j<2;j++){a.legs[j].rotation.x=swing*(j?1:-1);a.arms[j].rotation.x=-swing*(j?1:-1)}a.x=a.g.position.x;a.z=a.g.position.z}camera.position.lerp(new T.Vector3(player.position.x+Math.sin(yaw)*8,4.5+pitch,player.position.z+Math.cos(yaw)*8),.15);camera.lookAt(player.position.x,1.3,player.position.z);$('hud').innerHTML='<b>OUTBREAK</b><br>HP '+Math.ceil(state.hp)+' • Hunger '+Math.ceil(state.hunger)+' • Ammo '+state.ammo+'<br>Food '+state.food+' | Wood '+state.wood+' | Metal '+state.metal+' | Crew '+state.crew;$('msg').textContent=state.hp<=0?'You died — open CREW / BAG to reset':now<until?notice:'';renderer.render(scene,camera)}requestAnimationFrame(frame);
