<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Dead Frontier: Outbreak</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:14px system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:absolute;top:12px;left:14px;background:#101510df;padding:12px;border-left:3px solid #b6a16a;max-width:75%;pointer-events:none}#hud b{letter-spacing:2px;color:#d7c18b}#msg{position:absolute;top:35%;width:100%;text-align:center;pointer-events:none;text-shadow:0 2px 4px black}button{background:#202820dd;color:white;border:1px solid #a5aa8a;border-radius:12px;padding:14px;font-weight:bold;touch-action:none}#actions{position:absolute;right:16px;bottom:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}#pad{position:absolute;left:20px;bottom:22px;display:grid;grid-template-columns:repeat(3,48px);gap:4px}#pad button{padding:12px}#menu{position:absolute;right:12px;top:12px}#panel{position:absolute;inset:12% 15%;background:#111b16f5;border:1px solid #888;padding:20px;overflow:auto;touch-action:pan-y;display:none}#start{position:absolute;inset:0;background:#101810f5;display:grid;place-content:center;text-align:center;padding:25px;z-index:5}h1{letter-spacing:4px;color:#d4c08c}small{color:#bbb}</style></head><body><div id="hud"></div><div id="msg"></div><button id="menu">CREW / BAG</button><div id="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div id="actions"><button id="attack">ATTACK</button><button id="interact">SEARCH / USE</button><button id="build">REPAIR</button><button id="eat">EAT</button></div><div id="panel"></div><div id="start"><h1>DEAD FRONTIER<br>OUTBREAK</h1><p>Mobile survival prototype • V0.1</p><p>Explore. Scavenge. Recruit. Rebuild.</p><button id="play">ENTER WORLD</button><small id="loading">Loading 3D engine… Internet required.</small></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id); const scene=new T.Scene();scene.background=new T.Color(0x88958c);scene.fog=new T.FogExp2(0x88958c,.014);const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xe0e7dc,0x484638,2));const sun=new T.DirectionalLight(0xffe5bb,2);sun.position.set(20,40,15);scene.add(sun);
function box(w,h,d,c,x,y,z,parent=scene){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c}));m.position.set(x,y,z);parent.add(m);return m}box(150,.2,150,0x53604a,0,-.15,0);box(12,.03,145,0x454744,0,0,0);box(145,.03,9,0x454744,0,.01,0);for(let i=-65;i<70;i+=8)box(.15,.04,3,0xb8ad77,0,.03,i);
let state={x:0,z:8,hp:100,hunger:100,food:2,water:1,wood:0,metal:0,ammo:12,fuel:0,clothes:0,crew:0,home:false,repair:0,kills:0,looted:[],recruited:[],dead:[],enemy:false};try{Object.assign(state,JSON.parse(localStorage.getItem('outbreak-v01')||'{}'))}catch{}function save(){state.x=player.position.x;state.z=player.position.z;try{localStorage.setItem('outbreak-v01',JSON.stringify(state))}catch{}}
function person(color,x,z){let g=new T.Group();box(.65,.85,.36,color,0,1.1,0,g);box(.38,.38,.38,0xb59a7b,0,1.75,0,g);for(const a of [-1,1]){box(.23,.75,.25,0x303633,a*.19,.4,0,g);box(.18,.7,.2,color,a*.43,1.05,0,g)}g.position.set(x,0,z);scene.add(g);return g}const player=person(0x384c58,state.x,state.z);let facing=new T.Vector3(0,0,-1);const spots=[],walls=[];function wall(w,h,d,c,x,z){box(w,h,d,c,x,h/2,z);walls.push({x,z,w,d})}function house(id,name,x,z,color,loot){box(8,.12,7,0x777369,x,.04,z);wall(8,2.8,.25,color,x,z-3.5);wall(.25,2.8,7,color,x-4,z);wall(.25,2.8,7,color,x+4,z);wall(2.8,2.8,.25,color,x-2.6,z+3.5);wall(2.8,2.8,.25,color,x+2.6,z+3.5);box(2,.8,1,0x766044,x, .4,z-2);spots.push({id,name,x,z:z-1,loot});box(.7,.7,.7,0xb29a56,x,.4,z-1)}house('market','Market',-12,-12,0x817f69,{food:5,water:3});house('garage','Garage',12,-12,0x777d76,{metal:5,fuel:4});house('home','Safe house',-12,13,0x9b8975,{wood:4,clothes:1});house('police','Police station',12,13,0x7a8380,{ammo:18,metal:2});house('yard','Supply depot',-28,-12,0x756a58,{wood:10,metal:5});house('camp','Raider camp',28,-12,0x64584c,{food:4,ammo:10});
for(let i=0;i<24;i++){let x=(i%2?1:-1)*(20+(i%5)*9),z=-58+i*5;box(.5,3,.5,0x594b39,x,1.5,z);let m=new T.Mesh(new T.ConeGeometry(2,5,7),new T.MeshStandardMaterial({color:0x394e35}));m.position.set(x,4,z);scene.add(m)}for(let i=0;i<4;i++){let x=3,z=-25+i*13;box(2,1,4,0x6b7166,x,.7,z);box(1.7,.7,2,0x363e3d,x,1.45,z)}const npcs=[{id:'medic',name:'Maya the medic',x:-8,z:6},{id:'scout',name:'Eli the scout',x:9,z:-6}];for(const n of npcs){n.mesh=person(0x557b75,n.x,n.z);n.mesh.visible=!state.recruited.includes(n.id)}const enemies=[];for(let i=0;i<9;i++){let id='z'+i;let m=person(0x69734a,Math.sin(i*2.4)*23,Math.cos(i*2.4)*23);m.visible=!state.dead.includes(id);enemies.push({id,m,hp:2,hostile:false})}for(let i=0;i<3;i++){let id='r'+i;let m=person(0x82453c,26+i*2,-7);m.visible=!state.dead.includes(id);enemies.push({id,m,hp:3,hostile:true})}
let active=false,keys={},notice='',until=0;function tell(s){notice=s;until=performance.now()+3000}function dist(x,z){return Math.hypot(player.position.x-x,player.position.z-z)}function nearest(a){return a.slice().sort((a,b)=>dist(a.x,a.z)-dist(b.x,b.z))[0]}function use(){let n=nearest(npcs.filter(n=>n.mesh.visible));if(n&&dist(n.x,n.z)<3){state.crew++;state.recruited.push(n.id);n.mesh.visible=false;tell(n.name+' joined your crew');save();return}let s=nearest(spots);if(dist(s.x,s.z)>3){tell('Move near a supply crate or survivor');return}if(s.id==='camp'&&enemies.some(e=>e.hostile&&e.m.visible)){tell('Clear the raiders first');return}if(!state.looted.includes(s.id)){for(let k in s.loot)state[k]+=s.loot[k];state.looted.push(s.id);tell('Collected supplies: '+s.name)}else tell('Already searched');if(s.id==='home'){state.home=true;tell('Safe house claimed')}if(s.id==='camp'){state.enemy=true;tell('Raider camp captured')}save()}
$('interact').onclick=use;$('attack').onclick=()=>{let e=enemies.filter(e=>e.m.visible).sort((a,b)=>dist(a.m.position.x,a.m.position.z)-dist(b.m.position.x,b.m.position.z))[0];if(!e){tell('No enemies remaining');return}let d=dist(e.m.position.x,e.m.position.z);if(d> (state.ammo?12:2.5)){tell('Enemy out of range');return}if(state.ammo){state.ammo--;e.hp-=2}else e.hp--;if(e.hp<=0){e.m.visible=false;state.dead.push(e.id);state.kills++;tell('Enemy defeated')}else tell('Hit');save()};$('build').onclick=()=>{if(!state.home||dist(-12,12)>7){tell('Claim and return to the safe house');return}if(state.repair>=3){tell('Home fully repaired');return}if(state.wood<2||state.metal<1){tell('Need 2 wood and 1 metal');return}state.wood-=2;state.metal--;state.repair++;box(2.5,1.2,.2,0x8c6945,-15+(state.repair-1)*2.5,.6,17);tell('Home repaired: '+state.repair+'/3');save()};$('eat').onclick=()=>{if(state.food){state.food--;state.hunger=Math.min(100,state.hunger+35);state.hp=Math.min(100,state.hp+15);save();tell('Food consumed')}else tell('No food')};for(let i=0;i<state.repair;i++)box(2.5,1.2,.2,0x8c6945,-15+i*2.5,.6,17);
$('menu').onclick=()=>{let p=$('panel');p.style.display='block';p.innerHTML='<h2>Survivor journal</h2><p>Food '+state.food+' • Water '+state.water+' • Wood '+state.wood+' • Metal '+state.metal+' • Ammo '+state.ammo+' • Fuel '+state.fuel+' • Clothing '+state.clothes+'</p><p>Crew: '+state.crew+' / 2 | Home: '+(state.home?'Claimed':'Unclaimed')+' | Repairs: '+state.repair+'/3 | Raider camp: '+(state.enemy?'Captured':'Hostile')+'</p><p>Mission 1: Search the market. Mission 2: Claim the safe house. Mission 3: Recruit two survivors. Mission 4: Repair home. Mission 5: Capture raider camp.</p><button id="close">RETURN</button> <button id="reset">RESET SAVE</button>';$('close').onclick=()=>p.style.display='none';$('reset').onclick=()=>{if(confirm('Erase progress?')){localStorage.removeItem('outbreak-v01');location.reload()}}};document.querySelectorAll('[data-dir]').forEach(b=>{let k=b.dataset.dir;b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[k]=true};b.onpointerup=b.onpointercancel=()=>keys[k]=false});addEventListener('keydown',e=>keys[({w:'up',a:'left',s:'down',d:'right',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'})[e.key]]=true);addEventListener('keyup',e=>keys[({w:'up',a:'left',s:'down',d:'right',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'})[e.key]]=false);$('loading').textContent='Ready • Rotate phone to landscape';$('play').onclick=()=>{active=true;$('start').style.display='none'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=performance.now(),tick=0;function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000);last=now;if(active&&$('panel').style.display!=='block'&&state.hp>0){let v=new T.Vector3((keys.right?1:0)-(keys.left?1:0),0,(keys.down?1:0)-(keys.up?1:0));if(v.length()){v.normalize();facing.copy(v);player.rotation.y=Math.atan2(v.x,v.z);for(let axis of ['x','z']){let p=player.position.clone();p[axis]+=v[axis]*5*dt;if(Math.abs(p[axis])<69&&!walls.some(w=>Math.abs(p.x-w.x)<w.w/2+.35&&Math.abs(p.z-w.z)<w.d/2+.35))player.position[axis]=p[axis]}}for(let e of enemies){if(!e.m.visible)continue;let d=dist(e.m.position.x,e.m.position.z);if(d<14&&d>1.2){let v=player.position.clone().sub(e.m.position).normalize();let p=e.m.position.clone().addScaledVector(v,dt*(e.hostile?2.4:1.4));if(!walls.some(w=>Math.abs(p.x-w.x)<w.w/2+.3&&Math.abs(p.z-w.z)<w.d/2+.3))e.m.position.copy(p);e.m.rotation.y=Math.atan2(v.x,v.z)}if(d<1.5)state.hp=Math.max(0,state.hp-dt*5)}state.hunger=Math.max(0,state.hunger-dt*.12);if(!state.hunger)state.hp=Math.max(0,state.hp-dt*2);tick+=dt;if(tick>3){save();tick=0}}camera.position.lerp(new T.Vector3(player.position.x,player.position.y+7,player.position.z+10),.12);camera.lookAt(player.position.x,1,player.position.z-2);$('hud').innerHTML='<b>OUTBREAK</b><br>HP '+Math.ceil(state.hp)+' • Hunger '+Math.ceil(state.hunger)+' • Ammo '+state.ammo+'<br>Food '+state.food+' | Wood '+state.wood+' | Metal '+state.metal+' | Crew '+state.crew;$('msg').textContent=state.hp<=0?'You died — open CREW / BAG to reset':now<until?notice:'';renderer.render(scene,camera)}requestAnimationFrame(frame);
