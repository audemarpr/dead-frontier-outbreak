<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outbreak Command</title><style>body{background:#101713;color:#e9e7dc;font:16px system-ui;margin:0;padding:20px}main{max-width:900px;margin:auto}section{background:#202c25;padding:18px;border:1px solid #59664e;border-radius:12px;margin:16px 0}h1,h2{color:#d8bf85}input,select,button{font:inherit;padding:12px;margin:5px 0;max-width:100%;box-sizing:border-box}input,select{background:#111a15;color:white;border:1px solid #64715b;width:100%}button{background:#d8bf85;color:#151a14;border:0;border-radius:6px}a{color:#d8bf85}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>OUTBREAK / COMMAND</h1><a href="./">Return to game</a><section><p id="status">Checking configuration…</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button> <button id="logout">Sign out</button></section><section id="dashboard" hidden><h2>Cloud player records</h2><button id="refresh">Refresh</button><select id="players"></select><pre id="summary"></pre><h2>Resource and progress editor</h2><select id="field"></select><input id="value" type="number" min="0" max="100000"><button id="apply">Save change</button><p>Changes affect cloud saves only. Players must restore them manually.</p></section></main><script type="module">import {config} from './online-config.js';const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;let db,rows=[];const fields=['food','water','wood','metal','ammo','fuel','clothes','scrap','medicine','bandage','hp','campaign'];for(let f of fields)$('field').add(new Option(f,f));async function authorize(){let {data:{session}}=await db.auth.getSession();$('dashboard').hidden=true;if(!session){status('Sign in required');return}let {data,error}=await db.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error)throw error;if(!data){status('Access denied: administrator role required');return}status('Administrator authenticated');$('dashboard').hidden=false;await refresh()}async function refresh(){let {data,error}=await db.from('saves').select('user_id,data,updated_at').order('updated_at',{ascending:false}).limit(100);if(error)throw error;rows=data;$('players').replaceChildren();for(let r of rows)$('players').add(new Option(r.user_id,r.user_id));render()}function render(){let r=rows.find(r=>r.user_id===$('players').value);$('summary').textContent=r?JSON.stringify({updated:r.updated_at,...Object.fromEntries(fields.map(f=>[f,r.data[f]])),vehicles:r.data.vehicles,territories:r.data.territories},null,2):'No cloud saves'}function run(id,fn){$(id).onclick=async()=>{try{if(!db)throw Error('Backend not configured');await fn()}catch(e){status(e.message)}}}run('login',async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)throw error;await authorize()});run('logout',async()=>{await db.auth.signOut();await authorize()});run('refresh',refresh);$('players').onchange=render;run('apply',async()=>{let r=rows.find(r=>r.user_id===$('players').value),f=$('field').value,n=Number($('value').value);if(!r||!fields.includes(f)||!$('value').value||!Number.isInteger(n)||n<0||n>(['hp','campaign'].includes(f)?100:100000))throw Error('Invalid value');if(!confirm('Update selected cloud save?'))return;let {data,error}=await db.from('saves').update({data:{...r.data,[f]:n},updated_at:new Date().toISOString()}).eq('user_id',r.user_id).eq('updated_at',r.updated_at).select('user_id');if(error)throw error;if(!data.length)throw Error('Save changed; refresh and retry');await refresh();status('Cloud record updated')});if(config.url&&config.key){try{let {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');db=createClient(config.url,config.key);await authorize()}catch(e){status(e.message)}}else status('Backend not configured. Complete Supabase setup first.');</script></body></html>
