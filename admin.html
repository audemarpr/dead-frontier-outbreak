<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outbreak Command</title><style>*{box-sizing:border-box}body{background:radial-gradient(ellipse at top,#242017,#08090b 55%);color:#f2eee5;font:15px system-ui;margin:0;padding:clamp(14px,4vw,32px);min-height:100vh}main{max-width:1000px;margin:auto}section{background:linear-gradient(145deg,#171719,#101012);padding:20px;border:1px solid #66532d;border-radius:16px;margin:18px 0}h1,h2{color:#e5c780;letter-spacing:.04em}h1{font-size:clamp(24px,6vw,42px)}input,select,button{font:inherit;padding:13px;margin:5px 0;max-width:100%;min-height:46px;border-radius:8px}input,select{background:#0b0c0e;color:white;border:1px solid #51452f;width:100%}button{background:linear-gradient(120deg,#a77a32,#f1d695);color:#15110a;border:0;font-weight:700}a{color:#e5c780}pre{white-space:pre-wrap;overflow-wrap:anywhere}#summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.metric{padding:14px;border:1px solid #423824;background:#0c0d10;border-radius:10px}.metric small{display:block;color:#b9b0a0;text-transform:uppercase;font-size:11px;letter-spacing:1px}.metric strong{display:block;font-size:24px;color:#e5c780;margin-top:6px}details{margin:15px 0;color:#c8c1b3}#status{color:#e5c780}header small{letter-spacing:3px;color:#b6a37d}</style></head><body><main><header><small>DEAD FRONTIER • CONTROL CENTER</small><h1>OUTBREAK / COMMAND</h1></header><a href="./">Return to game</a><section><p id="status">Checking configuration…</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button> <button id="logout">Sign out</button></section><section id="dashboard" hidden><h2>Cloud player records</h2><button id="refresh">Refresh</button><select id="players"></select><div id="summary"></div><details><summary>Vehicle & territory records</summary><pre id="details"></pre></details><h2>Resource and progress editor</h2><select id="field"></select><input id="value" type="number" min="0" max="100000"><button id="apply">Save change</button><p>Changes affect cloud saves only. Players must restore them manually.</p></section></main><script type="module">import {config} from './online-config.js';const $=id=>document.getElementById(id);const status=t=>$('status').textContent=t;let db,rows=[];const fields=['food','water','wood','metal','ammo','fuel','clothes','scrap','medicine','bandage','hp','campaign'];for(let f of fields)$('field').add(new Option(f,f));async function authorize(){let {data:{session}}=await db.auth.getSession();$('dashboard').hidden=true;if(!session){status('Sign in required');return}let {data,error}=await db.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error)throw error;if(!data){status('Access denied: administrator role required');return}status('Administrator authenticated');$('dashboard').hidden=false;await refresh()}async function refresh(){let {data,error}=await db.from('saves').select('user_id,data,updated_at').order('updated_at',{ascending:false}).limit(100);if(error)throw error;let selected=$('players').value;rows=data;$('players').replaceChildren();for(let r of rows)$('players').add(new Option(r.user_id,r.user_id));if(rows.some(r=>r.user_id===selected))$('players').value=selected;render()}function render(){let r=rows.find(r=>r.user_id===$('players').value);$('summary').replaceChildren();$('details').textContent='';if(!r){$('summary').textContent='No cloud saves';return}for(let f of fields){let d=document.createElement('div');d.className='metric';let l=document.createElement('small'),v=document.createElement('strong');l.textContent=f==='hp'?'Health':f;v.textContent=Number.isFinite(r.data[f])?Number(r.data[f].toFixed(2)):'—';d.append(l,v);$('summary').append(d)}$('details').textContent=JSON.stringify({updated:r.updated_at,vehicles:r.data.vehicles,territories:r.data.territories},null,2);$('value').value=r.data[$('field').value]??''}$('field').onchange=()=>{let r=rows.find(r=>r.user_id===$('players').value);$('value').value=r?.data[$('field').value]??''};function run(id,fn){$(id).onclick=async()=>{try{if(!db)throw Error('Backend not configured');await fn()}catch(e){status(e.message)}}}run('login',async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)throw error;await authorize()});run('logout',async()=>{await db.auth.signOut();await authorize()});run('refresh',refresh);$('players').onchange=render;run('apply',async()=>{let r=rows.find(r=>r.user_id===$('players').value),f=$('field').value,n=Number($('value').value);if(!r||!fields.includes(f)||!$('value').value||!Number.isInteger(n)||n<0||n>(['hp','campaign'].includes(f)?100:100000))throw Error('Invalid value');if(!confirm('Update selected cloud save?'))return;let {data,error}=await db.from('saves').update({data:{...r.data,[f]:n},updated_at:new Date().toISOString()}).eq('user_id',r.user_id).eq('updated_at',r.updated_at).select('user_id');if(error)throw error;if(!data.length)throw Error('Save changed; refresh and retry');await refresh();status('Cloud record updated')});if(config.url&&config.key){try{let {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');db=createClient(config.url,config.key);await authorize()}catch(e){status(e.message)}}else status('Backend not configured. Complete Supabase setup first.');</script></body></html>
